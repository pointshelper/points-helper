name: Store request
description: An Aeroplan eStore retailer you'd like supported.
labels: ["store request"]
body:
  - type: markdown
    attributes:
      value: "Put the store's name in the title above. Check the open issues first: if it's already there, add a 👍 instead."
  - type: input
    id: store
    attributes:
      label: Store
      placeholder: e.g. Best Buy
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Anything we should know?
      description: Optional. How often you shop there, or problems you've had earning points.
