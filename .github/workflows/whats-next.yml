name: What's next page

on:
  # Linear syncs each issue to a GitHub issue, so new items, title edits and Done/Canceled show up right away.
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  # Status moves between open columns (Planned → In progress → Approved for Production) don't touch the
  # GitHub issue, so a frequent schedule picks those up.
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may start it a few minutes late)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read Linear
        run: node scripts/build-roadmap.mjs
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ vars.LINEAR_TEAM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Keep the run history short: delete this workflow's finished runs older than 1 day.
  # A run that can't be deleted turns this job red (the page still deploys), so it doesn't pile up unnoticed.
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh api -X GET --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/whats-next.yml/runs" \
            -f status=completed -f per_page=100 -f created="<$cutoff" --jq '.workflow_runs[].id')
          failed=0
          for id in $ids; do
            if out=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" 2>&1); then
              echo "deleted run $id"
            else
              echo "::error::Couldn't delete run $id: $out"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed old run(s) couldn't be deleted. Delete them by hand from the Actions tab."
            exit 1
          fi
